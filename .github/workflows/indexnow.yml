# Tells Bing and the other IndexNow search engines that matchnightgame.com changed, once GitHub Pages has put the new
# version live (site 0.3.4, Kevin's pick "Hidden helpers", 31 Oct 2026). Google doesn't take IndexNow; it reads the
# sitemap that Search Console knows. The key file (<key>.txt at the site root) is written by build.py from
# indexnow.json; this file lives in the repository as .github/workflows/indexnow.yml (source: the site's source
# folder, indexnow.yml). It can also be run by hand from the repository's Actions tab.
name: Tell search engines
on:
  push:
    branches: [main]
    paths: ['index.html', 'updates.html', 'sitemap.xml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Wait until the new version is live
        run: |
          want=$(sed -n 's/.*matchnightgame\.com, site \([0-9.]*\) -->.*/\1/p' index.html | head -1)
          echo "Waiting for site $want on https://matchnightgame.com/"
          for i in $(seq 1 80); do
            if curl -fsS "https://matchnightgame.com/?check=$i" | grep -qF "site $want -->"; then echo "Site $want is live"; exit 0; fi
            sleep 15
          done
          echo "Site $want did not show up within 20 minutes"; exit 1
      - name: Send the pages to IndexNow
        run: |
          key=$(ls | sed -n 's/^\([0-9a-f]\{32\}\)\.txt$/\1/p' | head -1)
          test -n "$key" || { echo "No IndexNow key file at the site root"; exit 1; }
          urls=$(sed -n 's|.*<loc>\(.*\)</loc>.*|"\1"|p' sitemap.xml | paste -sd, -)
          body="{\"host\":\"matchnightgame.com\",\"key\":\"$key\",\"keyLocation\":\"https://matchnightgame.com/$key.txt\",\"urlList\":[$urls]}"
          echo "$body"
          code=$(curl -sS -o reply.txt -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' -d "$body")
          cat reply.txt; echo; echo "IndexNow answered HTTP $code"
          case "$code" in 200|202) ;; *) exit 1;; esac
